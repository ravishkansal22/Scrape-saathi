services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrapsetu-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - SECRET_KEY=scrapsetu-development-secret-key-32chars!!
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
      - DATA_DIR=/app/data
      - STORE_BACKEND=sqlite
      - AUTH_MODE=local
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
    env_file:
      - path: .env
        required: false
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scrapsetu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
